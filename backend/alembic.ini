[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# The URL is intentionally absent. migrations/env.py reads DATABASE_URL from the
# environment through the application's own Settings object, so migrations and
# the running service can never point at different databases.
sqlalchemy.url =

# Migration filenames are prefixed with a UTC timestamp so that `ls` shows them
# in the order they were authored, which matters once several people are adding
# migrations on separate branches.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

# No post-write hooks. Formatting is enforced by pre-commit and by the `lint`
# CI job, which cover every file rather than only generated migrations, and do
# not depend on Alembic resolving a console-script entry point.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
