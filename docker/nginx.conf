# nginx configuration for the ShopSphere storefront.
#
# Two jobs: serve the built SPA, and proxy /api to the backend so the browser
# only ever talks to one origin. That keeps CORS out of the picture entirely in
# the Docker deployment, and means the frontend bundle contains no backend
# hostname - the same build artifact works in any environment.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresses the JS bundle from ~240 KB to ~70 KB on the wire.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API and the interactive docs both live on the backend.
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generous enough to cover the payment provider's own timeout, so a slow
        # checkout surfaces the backend's 504 rather than nginx's.
        proxy_read_timeout 60s;
    }

    location ~ ^/(docs|redoc|openapi.json|health) {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed asset filenames can be cached indefinitely; a new build produces
    # new names, so this can never serve a stale bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: React Router owns the URL space, so any unmatched path must
    # return index.html rather than 404. Without this, refreshing /orders/12
    # would break.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Mirrors the headers the API sets, so the two origins behave consistently.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
